<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- Immediate meta refresh -->
  <meta http-equiv="refresh" content="0; url=https://pyslammer.github.io/pySLAMMER/">
  <!-- Ask search engines not to index this redirect page -->
  <meta name="robots" content="noindex">
  <script>
    // JavaScript redirect using replace() so the old page isn't kept in the back-button history
    window.location.replace('https://pyslammer.github.io/pySLAMMER/');
  </script>
</head>
<body>
  <p>If you are not redirected automatically, follow this <a href="https://pyslammer.github.io/pySLAMMER/">link to the new docs</a>.</p>
</body>
</html>
